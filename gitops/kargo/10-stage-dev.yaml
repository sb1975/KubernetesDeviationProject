apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: k8s-deviation
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: k8s-deviation-warehouse
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/sb1975/KubernetesDeviationProject.git
            checkout:
              - branch: main
                path: ./src

        - uses: kustomize-set-image
          config:
            path: ./src/gitops/apps/k8s-deviation/overlays/dev
            images:
              - image: ghcr.io/sb1975/kubernetes-deviation-backend
                tag: ${{ imageFrom("ghcr.io/sb1975/kubernetes-deviation-backend").Tag }}
              - image: ghcr.io/sb1975/kubernetes-deviation-frontend
                tag: ${{ imageFrom("ghcr.io/sb1975/kubernetes-deviation-frontend").Tag }}

        - uses: git-commit
          config:
            path: ./src
            message: "promote(dev): update backend/frontend images"

        - uses: git-push
          config:
            path: ./src
            branch: main

  verification:
    analysisTemplates:
      - name: verify-dev-api
      - name: verify-dev-ui
    args:
      - name: environment
        value: dev
