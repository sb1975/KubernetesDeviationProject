apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: k8s-deviation
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: k8s-deviation-warehouse
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/sb1975/KubernetesDeviationProject.git
            checkout:
              - branch: main
                path: ./src

  verification:
    analysisTemplates:
      - name: verify-dev-api
      - name: verify-dev-ui
    args:
      - name: environment
        value: dev
