apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: k8s-deviation-staging

patchesStrategicMerge:
  - patch-backend.yaml
  - patch-frontend.yaml

images:
  - name: ghcr.io/sb1975/kubernetes-deviation-backend
    newTag: 0.1.0-staging
  - name: ghcr.io/sb1975/kubernetes-deviation-frontend
    newTag: 0.1.0-staging

commonLabels:
  app.kubernetes.io/environment: staging
