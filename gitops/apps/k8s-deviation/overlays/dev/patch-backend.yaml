apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deviation-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: APP_ENV
              value: dev
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
