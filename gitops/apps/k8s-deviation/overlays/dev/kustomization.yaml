apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: k8s-deviation-dev

patchesStrategicMerge:
  - patch-backend.yaml
  - patch-frontend.yaml

images:
  - name: ghcr.io/sb1975/kubernetes-deviation-backend
    newTag: 0.2.0-dev
  - name: ghcr.io/sb1975/kubernetes-deviation-frontend
    newTag: 0.2.0-dev

commonLabels:
  app.kubernetes.io/environment: dev
