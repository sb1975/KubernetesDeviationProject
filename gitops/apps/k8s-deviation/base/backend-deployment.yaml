apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deviation-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/sb1975/kubernetes-deviation-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: qwiklabs-gcp-placeholder
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
          readinessProbe:
            httpGet:
              path: /api/releases
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/releases
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: backend-data
              mountPath: /var/lib/k8s-deviation
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: k8s-deviation-backend-data
